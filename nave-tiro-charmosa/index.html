<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Estelar — Nave de Tiro</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --fg: #e8e8f0;
      --accent: #00d4ff;
      --accent2: #ff6b9d;
      --gold: #ffd700;
      --card: rgba(20, 20, 40, 0.85);
      --border: rgba(0, 212, 255, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #gameCanvas { display: block; width: 100vw; height: 100vh; }
    .ui-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .ui-layer > * { pointer-events: auto; }

    /* Joystick */
    .joystick-area {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 140px;
      height: 140px;
      pointer-events: auto;
    }
    .joystick-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(0,212,255,0.15), transparent 70%),
                  rgba(10,10,26,0.9);
      border: 2px solid var(--border);
      box-shadow:
        0 0 30px rgba(0,212,255,0.15),
        inset 0 0 30px rgba(0,0,0,0.5),
        0 8px 32px rgba(0,0,0,0.4);
    }
    .joystick-stick {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent) 60%, #0066aa);
      box-shadow:
        0 0 20px rgba(0,212,255,0.6),
        0 4px 16px rgba(0,0,0,0.5),
        inset 0 -4px 8px rgba(0,0,0,0.3);
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out, box-shadow 0.1s;
      pointer-events: none;
      z-index: 2;
    }
    .joystick-stick.active {
      box-shadow:
        0 0 30px rgba(0,212,255,0.9),
        0 6px 24px rgba(0,0,0,0.6),
        inset 0 -4px 8px rgba(0,0,0,0.3);
      transform: translate(-50%, -50%) scale(1.05);
    }

    /* Shoot Button */
    .shoot-area {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 100px;
      height: 100px;
      pointer-events: auto;
    }
    .shoot-btn {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,107,157,0.2), transparent 70%),
                  rgba(10,10,26,0.9);
      border: 2px solid rgba(255,107,157,0.4);
      box-shadow:
        0 0 30px rgba(255,107,157,0.15),
        inset 0 0 30px rgba(0,0,0,0.5),
        0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s, box-shadow 0.1s, border-color 0.1s;
      user-select: none;
    }
    .shoot-btn:active, .shoot-btn.firing {
      transform: scale(0.92);
      border-color: var(--accent2);
      box-shadow:
        0 0 40px rgba(255,107,157,0.6),
        inset 0 0 30px rgba(0,0,0,0.5),
        0 4px 16px rgba(0,0,0,0.4);
    }
    .shoot-icon {
      width: 40px;
      height: 40px;
      stroke: var(--accent2);
      stroke-width: 3;
      fill: none;
      filter: drop-shadow(0 0 8px rgba(255,107,157,0.8));
      animation: pulseIcon 1.5s ease-in-out infinite;
    }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    /* HUD */
    .hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .hud-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 16px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
    .hud-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hud-value.score { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .hud-value.lives { color: var(--accent2); text-shadow: 0 0 10px rgba(255,107,157,0.5); }
    .hud-value.level { color: var(--accent); text-shadow: 0 0 10px rgba(0,212,255,0.5); }

    /* Screens */
    .screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0a0a1a 0%, #151535 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
      padding: 24px;
      text-align: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .screen-title {
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      text-shadow: 0 0 60px rgba(0,212,255,0.3);
    }
    .screen-subtitle { font-size: 16px; opacity: 0.7; max-width: 320px; line-height: 1.6; }
    .btn {
      appearance: none;
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0088cc);
      color: #05101a;
      box-shadow: 0 6px 24px rgba(0,212,255,0.4);
    }
    .btn-primary:hover { box-shadow: 0 8px 32px rgba(0,212,255,0.6); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    .controls-hint {
      display: flex;
      gap: 32px;
      margin-top: 8px;
      opacity: 0.6;
      font-size: 14px;
    }
    .hint { display: flex; align-items: center; gap: 8px; }
    .hint-icon { width: 28px; height: 28px; stroke: var(--accent); flex-shrink: 0; }

    /* Pause overlay */
    #pauseOverlay { background: rgba(10,10,26,0.9); backdrop-filter: blur(8px); }
    #pauseOverlay .screen-title { font-size: 32px; }

    /* Game Over */
    .final-score { font-size: 28px; color: var(--gold); text-shadow: 0 0 20px rgba(255,215,0,0.5); }
    .high-score { font-size: 14px; opacity: 0.5; }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .joystick-area { width: 120px; height: 120px; right: 12px; bottom: 12px; }
      .joystick-stick { width: 48px; height: 48px; }
      .shoot-area { width: 88px; height: 88px; left: 12px; bottom: 12px; }
      .shoot-icon { width: 34px; height: 34px; }
      .hud { gap: 12px; top: 10px; }
      .hud-item { padding: 6px 12px; }
      .hud-value { font-size: 15px; }
      .controls-hint { gap: 16px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <!-- Joystick -->
    <div class="joystick-area" id="joystickArea" role="img" aria-label="Joystick de movimento">
      <div class="joystick-base"></div>
      <div class="joystick-stick" id="joystickStick"></div>
    </div>

    <!-- Shoot Button -->
    <div class="shoot-area" id="shootArea" role="button" aria-label="Atirar" tabindex="0">
      <div class="shoot-btn" id="shootBtn">
        <svg class="shoot-icon" viewBox="0 0 24 24">
          <path d="M12 2L15 8H20L16 11L18 17L12 14L6 17L8 11L4 8H9L12 2Z"/>
        </svg>
      </div>
    </div>

    <!-- HUD -->
    <div class="hud" role="status" aria-live="polite">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span class="hud-value score" id="scoreEl">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Vidas</span>
        <span class="hud-value lives" id="livesEl">3</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Nível</span>
        <span class="hud-value level" id="levelEl">1</span>
      </div>
    </div>
  </div>

  <!-- Start Screen -->
  <div class="screen" id="startScreen" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <h1 class="screen-title" id="startTitle">ESTELAR</h1>
    <p class="screen-subtitle">Pilote sua nave, desvie dos asteroides e destrua inimigos. Sobreviva o máximo que puder!</p>
    <div class="controls-hint">
      <div class="hint">
        <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
        </svg>
        <span>Mover</span>
      </div>
      <div class="hint">
        <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L15 8H20L16 11L18 17L12 14L6 17L8 11L4 8H9L12 2Z"/>
        </svg>
        <span>Atirar</span>
      </div>
    </div>
    <button class="btn btn-primary" id="startBtn">Iniciar Jogo</button>
    <button class="btn btn-secondary" id="muteBtn">🔊 Som: Ligado</button>
  </div>

  <!-- Pause Overlay -->
  <div class="screen hidden" id="pauseOverlay" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <h1 class="screen-title" id="pauseTitle">PAUSADO</h1>
    <button class="btn btn-primary" id="resumeBtn">Continuar</button>
    <button class="btn btn-secondary" id="quitBtn">Sair para Menu</button>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameOverScreen" role="dialog" aria-modal="true" aria-labelledby="goTitle">
    <h1 class="screen-title" id="goTitle">FIM DE JOGO</h1>
    <div class="final-score" id="finalScore">0</div>
    <div class="high-score" id="highScore">Recorde: 0</div>
    <button class="btn btn-primary" id="restartBtn">Jogar Novamente</button>
    <button class="btn btn-secondary" id="menuBtn">Menu Inicial</button>
  </div>

<script>
// ===== GAME CONFIG =====
const CONFIG = {
  // Player
  playerSpeed: 320,
  playerSize: 28,
  fireRate: 180,
  tripleShotDuration: 5000,
  shieldDuration: 4000,
  // Bullets
  bulletSpeed: 600,
  bulletSize: 6,
  enemyBulletSpeed: 300,
  // Enemies
  enemyBaseSpeed: 80,
  enemySpawnRate: 1200,
  enemySize: 32,
  // Asteroids
  asteroidBaseSpeed: 50,
  asteroidSpawnRate: 2000,
  asteroidSizes: [24, 36, 48],
  // Powerups
  powerupSpawnChance: 0.08,
  powerupSpeed: 60,
  powerupSize: 20,
  // Particles
  maxParticles: 300,
  // Stars
  starCount: 120,
  // Levels
  levelThresholds: [0, 2000, 5000, 10000, 18000, 30000, 50000],
  // Screen shake
  shakeIntensity: 0,
  shakeDecay: 0.9
};

// ===== AUDIO ENGINE (Web Audio API) =====
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.masterGain = null;
    this.sounds = {};
  }
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.connect(this.ctx.destination);
    this.masterGain.gain.value = 0.35;
    this._buildSounds();
  }
  _buildSounds() {
    // Shoot
    this.sounds.shoot = () => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(600, this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.1);
      g.gain.setValueAtTime(0.15, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
      o.connect(g).connect(this.masterGain);
      o.start(); o.stop(this.ctx.currentTime + 0.15);
    };
    // Enemy shoot
    this.sounds.enemyShoot = () => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.1, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
      o.connect(g).connect(this.masterGain);
      o.start(); o.stop(this.ctx.currentTime + 0.25);
    };
    // Explosion
    this.sounds.explosion = (pitch = 1) => {
      const n = this.ctx.createBufferSource();
      const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.4, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (buffer.length * 0.3));
      n.buffer = buffer;
      const nf = this.ctx.createBiquadFilter();
      nf.type = 'lowpass';
      nf.frequency.setValueAtTime(800 * pitch, this.ctx.currentTime);
      nf.frequency.exponentialRampToValueAtTime(100 * pitch, this.ctx.currentTime + 0.4);
      const g = this.ctx.createGain();
      n.connect(nf).connect(g).connect(this.masterGain);
      g.gain.setValueAtTime(0.25, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
      n.start(); n.stop(this.ctx.currentTime + 0.5);
    };
    // Powerup
    this.sounds.powerup = () => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(400, this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.15);
      o.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.3);
      g.gain.setValueAtTime(0.15, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
      o.connect(g).connect(this.masterGain);
      o.start(); o.stop(this.ctx.currentTime + 0.4);
    };
    // Hit player
    this.sounds.playerHit = () => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(300, this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.2);
      g.gain.setValueAtTime(0.2, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
      o.connect(g).connect(this.masterGain);
      o.start(); o.stop(this.ctx.currentTime + 0.3);
    };
    // Level up
    this.sounds.levelUp = () => {
      [400, 500, 660, 880].forEach((f, i) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.1, this.ctx.currentTime + i * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.15);
        o.connect(g).connect(this.masterGain);
        o.start(this.ctx.currentTime + i * 0.08);
        o.stop(this.ctx.currentTime + i * 0.08 + 0.2);
      });
    };
    // Game over
    this.sounds.gameOver = () => {
      [330, 260, 200, 160].forEach((f, i) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'square';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.15 + 0.3);
        o.connect(g).connect(this.masterGain);
        o.start(this.ctx.currentTime + i * 0.15);
        o.stop(this.ctx.currentTime + i * 0.15 + 0.4);
      });
    };
  }
  play(name) { if (this.enabled && this.sounds[name]) this.sounds[name](); }
  toggle() { this.enabled = !this.enabled; return this.enabled; }
  setVolume(v) { if (this.masterGain) this.masterGain.gain.value = v; }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
}
const audio = new AudioEngine();

// ===== MATH UTILS =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => Math.random() * (b - a) + a;
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx*dx + dy*dy; };

// ===== PARTICLE SYSTEM =====
class Particle {
  constructor(x, y, color, life, size, vx, vy, gravity = 0) {
    this.x = x; this.y = y; this.color = color; this.life = life; this.maxLife = life;
    this.size = size; this.vx = vx; this.vy = vy; this.gravity = gravity; this.alpha = 1;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vy += this.gravity * dt;
    this.life -= dt;
    this.alpha = this.life / this.maxLife;
    return this.life > 0;
  }
  draw(ctx) {
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class ParticleSystem {
  constructor(max = 300) { this.particles = []; this.max = max; }
  add(x, y, color, count, speed, life, size, gravity = 0) {
    for (let i = 0; i < count; i++) {
      if (this.particles.length >= this.max) this.particles.shift();
      const angle = rand(0, Math.PI * 2);
      const spd = rand(speed * 0.5, speed);
      this.particles.push(new Particle(
        x, y, color, rand(life * 0.6, life), rand(size * 0.5, size),
        Math.cos(angle) * spd, Math.sin(angle) * spd, gravity
      ));
    }
  }
  addDirectional(x, y, color, angle, spread, count, speed, life, size) {
    for (let i = 0; i < count; i++) {
      if (this.particles.length >= this.max) this.particles.shift();
      const a = angle + rand(-spread, spread);
      const spd = rand(speed * 0.7, speed);
      this.particles.push(new Particle(
        x, y, color, rand(life * 0.7, life), rand(size * 0.7, size),
        Math.cos(a) * spd, Math.sin(a) * spd, 0
      ));
    }
  }
  update(dt) { this.particles = this.particles.filter(p => p.update(dt)); }
  draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
}

// ===== STARFIELD =====
class Starfield {
  constructor(count, w, h) { this.stars = []; this.resize(w, h); this.init(count); }
  resize(w, h) { this.w = w; this.h = h; }
  init(count) {
    this.stars = [];
    for (let i = 0; i < count; i++) {
      this.stars.push({
        x: rand(0, this.w), y: rand(0, this.h),
        size: rand(0.5, 2.5),
        speed: rand(15, 80),
        brightness: rand(0.3, 1),
        twinkle: rand(0, Math.PI * 2),
        twinkleSpeed: rand(1, 4)
      });
    }
  }
  update(dt) {
    for (const s of this.stars) {
      s.y += s.speed * dt;
      s.twinkle += s.twinkleSpeed * dt;
      if (s.y > this.h) { s.y = 0; s.x = rand(0, this.w); }
    }
  }
  draw(ctx) {
    for (const s of this.stars) {
      const alpha = s.brightness * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// ===== ENTITIES =====
class Player {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.x = w / 2; this.y = h - 80;
    this.size = CONFIG.playerSize;
    this.hp = 3; this.maxHp = 3;
    this.invuln = 0;
    this.fireCooldown = 0;
    this.tripleShot = 0;
    this.shield = 0;
    this.score = 0;
    this.level = 1;
    this.kills = 0;
  }
  reset(w, h) {
    this.w = w; this.h = h;
    this.x = w / 2; this.y = h - 80;
    this.hp = 3; this.maxHp = 3;
    this.invuln = 0;
    this.fireCooldown = 0;
    this.tripleShot = 0;
    this.shield = 0;
    this.score = 0;
    this.level = 1;
    this.kills = 0;
  }
  update(dt, input, bullets, particles, audio) {
    // Movement
    const speed = CONFIG.playerSpeed * dt;
    this.x += input.x * speed;
    this.y += input.y * speed;
    this.x = clamp(this.x, this.size, this.w - this.size);
    this.y = clamp(this.y, this.size, this.h - this.size);

    // Timers
    if (this.invuln > 0) this.invuln -= dt;
    if (this.tripleShot > 0) this.tripleShot -= dt;
    if (this.shield > 0) this.shield -= dt;
    if (this.fireCooldown > 0) this.fireCooldown -= dt;

    // Shooting
    if (input.fire && this.fireCooldown <= 0) {
      const rate = CONFIG.fireRate;
      this.fireCooldown = rate;
      audio.play('shoot');
      // Center bullet
      bullets.push(new Bullet(this.x, this.y - this.size, 0, -1, true));
      particles.addDirectional(this.x, this.y - this.size, '#00d4ff', -Math.PI/2, 0.3, 4, 100, 0.3, 3);
      if (this.tripleShot > 0) {
        bullets.push(new Bullet(this.x - 10, this.y - this.size, -0.3, -1, true));
        bullets.push(new Bullet(this.x + 10, this.y - this.size, 0.3, -1, true));
      }
    }
  }
  draw(ctx, shakeX, shakeY) {
    const x = this.x + shakeX, y = this.y + shakeY;
    const blink = this.invuln > 0 && Math.floor(this.invuln * 15) % 2 === 0;
    if (blink) return;

    // Shield
    if (this.shield > 0) {
      ctx.save();
      ctx.translate(x, y);
      const pulse = 1 + 0.15 * Math.sin(performance.now() / 100);
      ctx.strokeStyle = `rgba(0, 212, 255, ${0.5 + 0.3 * Math.sin(performance.now() / 80)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.size * 1.3 * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Ship body
    ctx.save();
    ctx.translate(x, y);

    // Engine glow
    const enginePulse = 1 + 0.3 * Math.sin(performance.now() / 60);
    const grad = ctx.createRadialGradient(0, this.size * 0.6, 0, 0, this.size * 0.6, this.size * 1.2 * enginePulse);
    grad.addColorStop(0, 'rgba(0,212,255,0.6)');
    grad.addColorStop(0.5, 'rgba(0,150,255,0.3)');
    grad.addColorStop(1, 'rgba(0,50,100,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, this.size * 0.6, this.size * 0.7, this.size * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hull
    ctx.fillStyle = '#1a2a4a';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -this.size);
    ctx.lineTo(this.size * 0.7, this.size * 0.5);
    ctx.lineTo(this.size * 0.3, this.size * 0.5);
    ctx.lineTo(this.size * 0.3, this.size * 0.9);
    ctx.lineTo(-this.size * 0.3, this.size * 0.9);
    ctx.lineTo(-this.size * 0.3, this.size * 0.5);
    ctx.lineTo(-this.size * 0.7, this.size * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cockpit
    ctx.fillStyle = '#88ccff';
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.7);
    ctx.lineTo(this.size * 0.35, this.size * 0.1);
    ctx.lineTo(-this.size * 0.35, this.size * 0.1);
    ctx.closePath();
    ctx.fill();

    // Wings accent
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-this.size * 0.7, this.size * 0.5);
    ctx.lineTo(-this.size * 1.1, this.size * 0.8);
    ctx.moveTo(this.size * 0.7, this.size * 0.5);
    ctx.lineTo(this.size * 1.1, this.size * 0.8);
    ctx.stroke();

    // Triple shot indicator
    if (this.tripleShot > 0) {
      ctx.fillStyle = '#ff6b9d';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('★ TRIPLE ★', 0, -this.size - 8);
    }

    ctx.restore();
  }
  takeHit(particles, audio) {
    if (this.invuln > 0 || this.shield > 0) return false;
    this.hp--;
    this.invuln = 1.5;
    audio.play('playerHit');
    particles.add(this.x, this.y, '#ff6b9d', 20, 200, 0.6, 5, 50);
    particles.add(this.x, this.y, '#ffd700', 15, 150, 0.5, 4, 0);
    CONFIG.shakeIntensity = 8;
    return this.hp <= 0;
  }
  addScore(points, particles, audio) {
    this.score += points;
    this.kills++;
    // Level up check
    const newLevel = CONFIG.levelThresholds.findIndex(t => this.score < t);
    const actualLevel = newLevel === -1 ? CONFIG.levelThresholds.length : newLevel;
    if (actualLevel > this.level) {
      this.level = actualLevel;
      audio.play('levelUp');
      particles.add(this.x, this.y, '#ffd700', 30, 250, 1.2, 6, -30);
    }
  }
  applyPowerup(type, particles, audio) {
    audio.play('powerup');
    particles.add(this.x, this.y, type === 'health' ? '#ff6b9d' : type === 'triple' ? '#ff6b9d' : '#00d4ff', 25, 200, 0.8, 5, -20);
    if (type === 'health' && this.hp < this.maxHp) this.hp++;
    else if (type === 'triple') this.tripleShot = CONFIG.tripleShotDuration;
    else if (type === 'shield') this.shield = CONFIG.shieldDuration;
  }
}

class Bullet {
  constructor(x, y, vx, vy, friendly, damage = 1) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.friendly = friendly; this.damage = damage;
    this.size = CONFIG.bulletSize;
    this.life = 3;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    return this.life > 0 && this.y > -50 && this.y < canvas.height + 50 && this.x > -50 && this.x < canvas.width + 50;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.friendly) {
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 2);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.3, '#00d4ff');
      grad.addColorStop(1, 'rgba(0,212,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, this.size * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, this.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ff6b9d';
      ctx.shadowColor = '#ff6b9d';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

class Enemy {
  constructor(x, y, type, level) {
    this.x = x; this.y = y; this.type = type; this.level = level;
    this.size = CONFIG.enemySize;
    this.hp = 1 + Math.floor(level / 2);
    this.maxHp = this.hp;
    this.speed = CONFIG.enemyBaseSpeed * (0.8 + level * 0.15) * (type === 'fast' ? 1.8 : type === 'tank' ? 0.5 : 1);
    this.fireCooldown = rand(1, 3);
    this.sideMove = rand(0, Math.PI * 2);
    this.sideSpeed = rand(30, 80);
    this.color = type === 'fast' ? '#ff6b9d' : type === 'tank' ? '#ffaa00' : '#ff4466';
    this.points = type === 'fast' ? 150 : type === 'tank' ? 300 : 100;
  }
  update(dt, player, bullets, particles, audio) {
    // Move down
    this.y += this.speed * dt;
    // Side movement
    this.sideMove += dt * 2;
    this.x += Math.sin(this.sideMove) * this.sideSpeed * dt;
    this.x = clamp(this.x, this.size, canvas.width - this.size);

    // Shoot
    this.fireCooldown -= dt;
    if (this.fireCooldown <= 0 && this.y > 0 && this.y < canvas.height) {
      this.fireCooldown = rand(1.5, 3.5) / Math.max(1, this.level * 0.3);
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        bullets.push(new Bullet(this.x, this.y + this.size, (dx/dist) * CONFIG.enemyBulletSpeed, (dy/dist) * CONFIG.enemyBulletSpeed, false));
        audio.play('enemyShoot');
        particles.addDirectional(this.x, this.y + this.size, '#ff6b9d', Math.atan2(dy, dx), 0.2, 3, 80, 0.2, 2);
      }
    }
    return this.y < canvas.height + this.size && this.hp > 0;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    const s = this.size;
    // Body
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    if (this.type === 'fast') {
      // Diamond
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.8, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s * 0.8, 0);
      ctx.closePath();
    } else if (this.type === 'tank') {
      // Hexagon
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
        ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
      }
      ctx.closePath();
    } else {
      // Triangle
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.9, s * 0.7);
      ctx.lineTo(-s * 0.9, s * 0.7);
      ctx.closePath();
    }
    ctx.fill();
    ctx.stroke();
    // Core
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // HP bar if tank
    if (this.maxHp > 1) {
      const bw = s * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-bw/2, -s - 8, bw, 4);
      ctx.fillStyle = '#ff6b9d';
      ctx.fillRect(-bw/2, -s - 8, bw * (this.hp / this.maxHp), 4);
    }
    ctx.restore();
  }
  hit(damage, particles, audio) {
    this.hp -= damage;
    if (this.hp <= 0) {
      audio.play('explosion');
      particles.add(this.x, this.y, this.color, 25, 250, 0.7, 6, 0);
      particles.add(this.x, this.y, '#ffd700', 15, 200, 0.6, 5, -50);
      return true;
    }
    particles.addDirectional(this.x, this.y, '#fff', Math.random() * Math.PI * 2, Math.PI, 8, 150, 0.3, 3);
    return false;
  }
}

class Asteroid {
  constructor(x, y, size, level) {
    this.x = x; this.y = y; this.baseSize = size;
    this.size = size;
    this.level = level;
    this.speed = CONFIG.asteroidBaseSpeed * (0.5 + level * 0.1) * rand(0.8, 1.2);
    this.angle = rand(0, Math.PI * 2);
    this.spin = rand(-1, 1) * 0.5;
    this.vertices = this.genVertices();
    this.hp = size / 12;
    this.color = `hsl(${rand(20, 40)}, 40%, ${rand(30, 50)}%)`;
    this.points = Math.floor(size * 5);
  }
  genVertices() {
    const verts = [];
    const count = randInt(7, 12);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const r = this.size * rand(0.7, 1.0);
      verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    return verts;
  }
  update(dt) {
    this.y += this.speed * dt;
    this.angle += this.spin * dt;
    return this.y < canvas.height + this.size;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#556';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
    for (let i = 1; i < this.vertices.length; i++) ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Crater details
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    for (let i = 0; i < 3; i++) {
      const v = this.vertices[randInt(0, this.vertices.length - 1)];
      ctx.beginPath();
      ctx.arc(v.x * 0.5, v.y * 0.5, this.size * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  hit(damage, particles, audio) {
    this.hp -= damage;
    if (this.hp <= 0) {
      audio.play('explosion', 0.8);
      particles.add(this.x, this.y, this.color, 30, 200, 0.8, 8, 0);
      particles.add(this.x, this.y, '#ffaa00', 20, 150, 0.6, 5, -30);
      return true;
    }
    particles.addDirectional(this.x, this.y, '#888', Math.random() * Math.PI * 2, Math.PI, 6, 100, 0.2, 2);
    return false;
  }
}

class Powerup {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type;
    this.size = CONFIG.powerupSize;
    this.speed = CONFIG.powerupSpeed;
    this.pulse = rand(0, Math.PI * 2);
    this.colors = { health: '#ff6b9d', triple: '#ff6b9d', shield: '#00d4ff' };
    this.icons = {
      health: (ctx, s) => { ctx.fillStyle = '#fff'; ctx.font = `bold ${s}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('♥', 0, 1); },
      triple: (ctx, s) => { ctx.fillStyle = '#fff'; ctx.font = `bold ${s}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✦', 0, 1); },
      shield: (ctx, s) => { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2); ctx.stroke(); }
    };
  }
  update(dt) { this.y += this.speed * dt; this.pulse += dt * 5; return this.y < canvas.height + this.size; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    const pulseScale = 1 + 0.15 * Math.sin(this.pulse);
    const c = this.colors[this.type];
    // Glow
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 1.5 * pulseScale);
    grad.addColorStop(0, c + '80');
    grad.addColorStop(1, c + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, this.size * 1.5 * pulseScale, 0, Math.PI * 2);
    ctx.fill();
    // Box
    ctx.fillStyle = 'rgba(20,20,40,0.9)';
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    const s = this.size * pulseScale;
    ctx.beginPath();
    const r = 4;
    ctx.roundRect(-s, -s, s*2, s*2, r);
    ctx.fill(); ctx.stroke();
    // Icon
    this.icons[this.type](ctx, s * 0.7);
    ctx.restore();
  }
  collect(player, particles, audio) { player.applyPowerup(this.type, particles, audio); }
}

// ===== INPUT MANAGER =====
class InputManager {
  constructor() {
    this.keys = { left: false, right: false, up: false, down: false, fire: false };
    this.joystick = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0, stickX: 0, stickY: 0 };
    this.touchFire = false;
    this.setupKeyboard();
    this.setupJoystick();
    this.setupShootButton();
  }
  setupKeyboard() {
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') this.keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.keys.down = true;
      if (e.code === 'Space' || e.code === 'KeyK') { this.keys.fire = true; e.preventDefault(); }
      if (e.code === 'Escape' || e.code === 'KeyP') this.onPause?.();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') this.keys.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.keys.down = false;
      if (e.code === 'Space' || e.code === 'KeyK') this.keys.fire = false;
    });
  }
  setupJoystick() {
    const area = document.getElementById('joystickArea');
    const stick = document.getElementById('joystickStick');
    const maxDist = 56;
    const updateStick = (clientX, clientY) => {
      const rect = area.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
      this.joystick.stickX = dx / maxDist;
      this.joystick.stickY = dy / maxDist;
      stick.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
      stick.classList.add('active');
    };
    const start = (e) => {
      e.preventDefault();
      this.joystick.active = true;
      const touch = e.touches?.[0] || e;
      updateStick(touch.clientX, touch.clientY);
    };
    const move = (e) => {
      if (!this.joystick.active) return;
      e.preventDefault();
      const touch = e.touches?.[0] || e;
      updateStick(touch.clientX, touch.clientY);
    };
    const end = () => {
      this.joystick.active = false;
      this.joystick.stickX = 0;
      this.joystick.stickY = 0;
      stick.style.transform = 'translate(-50%, -50%)';
      stick.classList.remove('active');
    };
    area.addEventListener('touchstart', start, { passive: false });
    area.addEventListener('touchmove', move, { passive: false });
    area.addEventListener('touchend', end);
    area.addEventListener('touchcancel', end);
    // Mouse support for testing
    area.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
  }
  setupShootButton() {
    const btn = document.getElementById('shootBtn');
    const area = document.getElementById('shootArea');
    const press = (e) => { e.preventDefault(); this.touchFire = true; btn.classList.add('firing'); };
    const release = (e) => { e.preventDefault(); this.touchFire = false; btn.classList.remove('firing'); };
    area.addEventListener('touchstart', press, { passive: false });
    area.addEventListener('touchend', release);
    area.addEventListener('touchcancel', release);
    area.addEventListener('mousedown', press);
    window.addEventListener('mouseup', release);
    // Keyboard accessibility
    area.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') press(e); });
    area.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(e); });
  }
  getInput() {
    let x = 0, y = 0;
    if (this.keys.left) x -= 1;
    if (this.keys.right) x += 1;
    if (this.keys.up) y -= 1;
    if (this.keys.down) y += 1;
    if (this.joystick.active) {
      x = this.joystick.stickX;
      y = this.joystick.stickY;
    }
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y, fire: this.keys.fire || this.touchFire };
  }
  onPause() {}
}

// ===== GAME CLASS =====
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    
    // Initialize starfield FIRST before resize
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.starfield = new Starfield(CONFIG.starCount, this.w, this.h);
    
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.particles = new ParticleSystem(CONFIG.maxParticles);
    this.player = new Player(this.w, this.h);
    this.bullets = [];
    this.enemies = [];
    this.asteroids = [];
    this.powerups = [];
    this.input = new InputManager();
    this.input.onPause = () => this.togglePause();

    this.running = false;
    this.paused = false;
    this.lastTime = 0;
    this.enemyTimer = 0;
    this.asteroidTimer = 0;
    this.highScore = parseInt(localStorage.getItem('estelar_hiscore') || '0', 10);

    this.screens = {
      start: document.getElementById('startScreen'),
      pause: document.getElementById('pauseOverlay'),
      gameover: document.getElementById('gameOverScreen')
    };
    this.bindUI();
    this.showScreen('start');
    requestAnimationFrame(t => this.loop(t));
  }
  resize() {
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.canvas.width = this.w * devicePixelRatio;
    this.canvas.height = this.h * devicePixelRatio;
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    this.starfield.resize(this.w, this.h);
    if (this.player) { this.player.w = this.w; this.player.h = this.h; }
  }
  bindUI() {
    document.getElementById('startBtn').onclick = () => this.start();
    document.getElementById('restartBtn').onclick = () => this.start();
    document.getElementById('menuBtn').onclick = () => this.showScreen('start');
    document.getElementById('resumeBtn').onclick = () => this.togglePause();
    document.getElementById('quitBtn').onclick = () => { this.togglePause(); this.showScreen('start'); };
    document.getElementById('muteBtn').onclick = (e) => {
      const on = audio.toggle();
      e.target.textContent = on ? '🔊 Som: Ligado' : '🔇 Som: Desligado';
    };
  }
  showScreen(name) {
    Object.values(this.screens).forEach(s => s.classList.add('hidden'));
    if (name) this.screens[name].classList.remove('hidden');
  }
  start() {
    audio.resume();
    this.player.reset(this.w, this.h);
    this.bullets = [];
    this.enemies = [];
    this.asteroids = [];
    this.powerups = [];
    this.particles = new ParticleSystem(CONFIG.maxParticles);
    this.enemyTimer = 0;
    this.asteroidTimer = 0;
    this.paused = false;
    this.running = true;
    this.showScreen('');
    this.lastTime = performance.now();
  }
  togglePause() {
    if (!this.running) return;
    this.paused = !this.paused;
    if (this.paused) this.showScreen('pause');
    else { this.showScreen(''); this.lastTime = performance.now(); }
  }
  gameOver() {
    this.running = false;
    this.paused = false;
    if (this.player.score > this.highScore) {
      this.highScore = this.player.score;
      localStorage.setItem('estelar_hiscore', String(this.highScore));
    }
    document.getElementById('finalScore').textContent = this.player.score.toLocaleString();
    document.getElementById('highScore').textContent = `Recorde: ${this.highScore.toLocaleString()}`;
    audio.play('gameOver');
    this.showScreen('gameover');
  }
  spawnEnemy() {
    const types = ['normal', 'fast', 'tank'];
    const weights = [0.6, 0.25, 0.15];
    let r = Math.random(), sum = 0, type = 'normal';
    for (let i = 0; i < weights.length; i++) { sum += weights[i]; if (r < sum) { type = types[i]; break; } }
    const x = rand(CONFIG.enemySize, this.w - CONFIG.enemySize);
    this.enemies.push(new Enemy(x, -CONFIG.enemySize, type, this.player.level));
  }
  spawnAsteroid() {
    const size = CONFIG.asteroidSizes[randInt(0, CONFIG.asteroidSizes.length - 1)];
    const x = rand(size, this.w - size);
    this.asteroids.push(new Asteroid(x, -size, size, this.player.level));
  }
  spawnPowerup(x, y) {
    if (Math.random() > CONFIG.powerupSpawnChance) return;
    const types = ['health', 'triple', 'shield'];
    const type = types[randInt(0, types.length - 1)];
    this.powerups.push(new Powerup(x, y, type));
  }
  update(dt) {
    if (this.paused) return;

    // Screen shake decay
    CONFIG.shakeIntensity *= CONFIG.shakeDecay;
    const shakeX = (Math.random() - 0.5) * CONFIG.shakeIntensity * 2;
    const shakeY = (Math.random() - 0.5) * CONFIG.shakeIntensity * 2;

    // Input
    const input = this.input.getInput();

    // Player
    const dead = this.player.update(dt, input, this.bullets, this.particles, audio);
    if (dead) { this.gameOver(); return; }

    // Starfield
    this.starfield.update(dt);

    // Bullets
    this.bullets = this.bullets.filter(b => b.update(dt));

    // Enemies
    this.enemyTimer += dt * 1000;
    const spawnRate = Math.max(300, CONFIG.enemySpawnRate - this.player.level * 80);
    if (this.enemyTimer >= spawnRate) { this.enemyTimer = 0; this.spawnEnemy(); }

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      const alive = e.update(dt, this.player, this.bullets, this.particles, audio);
      if (!alive || e.y > this.h + e.size) { this.enemies.splice(i, 1); continue; }
      // Bullet collision
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (!b.friendly) continue;
        if (dist2(b.x, b.y, e.x, e.y) < (e.size + b.size) ** 2) {
          this.bullets.splice(j, 1);
          if (e.hit(1, this.particles, audio)) {
            this.player.addScore(e.points * this.player.level, this.particles, audio);
            this.spawnPowerup(e.x, e.y);
            this.enemies.splice(i, 1);
          }
          break;
        }
      }
      // Player collision
      if (dist2(this.player.x, this.player.y, e.x, e.y) < (this.player.size + e.size * 0.7) ** 2) {
        if (this.player.takeHit(this.particles, audio)) { this.gameOver(); return; }
        this.enemies.splice(i, 1);
        this.spawnPowerup(e.x, e.y);
      }
    }

    // Asteroids
    this.asteroidTimer += dt * 1000;
    const aRate = Math.max(800, CONFIG.asteroidSpawnRate - this.player.level * 50);
    if (this.asteroidTimer >= aRate) { this.asteroidTimer = 0; this.spawnAsteroid(); }

    for (let i = this.asteroids.length - 1; i >= 0; i--) {
      const a = this.asteroids[i];
      const alive = a.update(dt);
      if (!alive) { this.asteroids.splice(i, 1); continue; }
      // Bullet collision
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (!b.friendly) continue;
        if (dist2(b.x, b.y, a.x, a.y) < (a.size + b.size) ** 2) {
          this.bullets.splice(j, 1);
          if (a.hit(1, this.particles, audio)) {
            this.player.addScore(a.points, this.particles, audio);
            this.spawnPowerup(a.x, a.y);
            this.asteroids.splice(i, 1);
          }
          break;
        }
      }
      // Player collision
      if (dist2(this.player.x, this.player.y, a.x, a.y) < (this.player.size + a.size * 0.7) ** 2) {
        if (this.player.takeHit(this.particles, audio)) { this.gameOver(); return; }
        this.asteroids.splice(i, 1);
      }
    }

    // Enemy bullets vs player
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      if (b.friendly) continue;
      if (dist2(b.x, b.y, this.player.x, this.player.y) < (this.player.size + b.size) ** 2) {
        this.bullets.splice(i, 1);
        if (this.player.takeHit(this.particles, audio)) { this.gameOver(); return; }
      }
    }

    // Powerups
    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const p = this.powerups[i];
      const alive = p.update(dt);
      if (!alive) { this.powerups.splice(i, 1); continue; }
      if (dist2(p.x, p.y, this.player.x, this.player.y) < (this.player.size + p.size) ** 2) {
        p.collect(this.player, this.particles, audio);
        this.powerups.splice(i, 1);
      }
    }

    // Particles
    this.particles.update(dt);

    // HUD
    document.getElementById('scoreEl').textContent = this.player.score.toLocaleString();
    document.getElementById('livesEl').textContent = this.player.hp;
    document.getElementById('levelEl').textContent = this.player.level;

    return { shakeX, shakeY };
  }
  draw(shake) {
    const ctx = this.ctx;
    const { shakeX, shakeY } = shake || { shakeX: 0, shakeY: 0 };

    // Clear
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, this.w, this.h);

    // Starfield
    this.starfield.draw(ctx);

    // Entities
    this.asteroids.forEach(a => a.draw(ctx));
    this.enemies.forEach(e => e.draw(ctx));
    this.powerups.forEach(p => p.draw(ctx));
    this.bullets.forEach(b => b.draw(ctx));
    this.player.draw(ctx, shakeX, shakeY);
    this.particles.draw(ctx);
  }
  loop(time) {
    const dt = Math.min((time - this.lastTime) / 1000, 0.05);
    this.lastTime = time;
    const shake = this.update(dt);
    this.draw(shake);
    requestAnimationFrame(t => this.loop(t));
  }
}

// ===== INIT =====
const canvas = document.getElementById('gameCanvas');
audio.init();
new Game();

// Prevent context menu on long press
document.addEventListener('contextmenu', e => e.preventDefault());

// Ensure canvas focus for keyboard
canvas.tabIndex = 0;
canvas.focus();

</script>

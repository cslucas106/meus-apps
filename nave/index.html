<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Nave</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
    canvas { display: block; width: 100%; height: 100%; background: #161b22; touch-action: none; }
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    #menu-screen, #gameover-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    h1 { font-size: 28px; margin-bottom: 20px; color: #58a6ff; text-align: center; }
    p { margin-bottom: 20px; color: #8b949e; text-align: center; font-size: 16px; }
    button { padding: 14px 28px; font-size: 18px; font-weight: bold; background: #238636; color: #fff; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4); }
    button:active { background: #2ea043; transform: scale(0.98); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="score-display">Pontos: 0</div>
      <div id="lives-display">Vidas: 3</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="menu-screen">
      <h1>Nave Espacial</h1>
      <p>Arraste para mover e atirar automaticamente nos inimigos.</p>
      <button id="start-btn">JOGAR</button>
    </div>

    <div id="gameover-screen" class="hidden">
      <h1>FIM DE JOGO</h1>
      <p id="final-score">Pontuação: 0</p>
      <button id="restart-btn">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="controls.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>

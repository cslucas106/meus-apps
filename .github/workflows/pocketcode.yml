name: PocketCode verificação
# Só roda quando o PocketCode manda (botão "Rodar verificação"). Não gasta minutos sozinho.
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: Pasta do app (. = raiz do repositório)
        required: false
        default: '.'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar o projeto
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          cd "$PASTA"
          fail=0
          if [ -f package.json ]; then
            echo "== package.json encontrado em $PASTA =="
            if [ -f package-lock.json ]; then npm ci || fail=1; else npm install || fail=1; fi
            for s in lint test build; do
              if node -e "process.exit((require('./package.json').scripts||{})['$s']?0:1)"; then
                echo "== npm run $s =="
                npm run "$s" || fail=1
              else
                echo "== sem script $s: pulado =="
              fi
            done
          else
            echo "== sem package.json em $PASTA: conferindo a sintaxe dos arquivos .js =="
            n=0
            while IFS= read -r f; do
              n=$((n+1))
              echo "conferindo $f"
              node --check "$f" || fail=1
            done < <(find . -name '*.js' -not -path '*/node_modules/*' -not -path './.git/*')
            echo "$n arquivo(s) .js conferido(s)"
          fi
          exit $fail

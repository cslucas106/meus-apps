<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charme Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.stick{position:absolute;bottom:20px;width:100px;height:100px;pointer-events:auto}
.stick .base{position:absolute;inset:0;border:3px solid #444;border-radius:50%;background:rgba(255,255,255,0.05);box-shadow:inset 0 0 20px #000}
.stick .knob{position:absolute;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c44569);border:2px solid #fff3;box-shadow:0 4px 15px #ff6b9d80;transform:translate(-50%,-50%);transition:transform 50ms}
.btn-shoot{position:absolute;bottom:20px;right:20px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ffd93d,#ff9f1a);border:3px solid #fff3;box-shadow:0 4px 20px #ffd93d80,inset 0 -4px 10px #cc7700;display:flex;align-items:center;justify-content:center;font-size:28px;color:#333;text-shadow:0 1px #fff6;pointer-events:auto;transition:transform 80ms}
.btn-shoot:active{transform:scale(0.9);box-shadow:0 2px 10px #ffd93d80,inset 0 -2px 6px #cc7700}
@media (max-width:480px){.stick{width:80px;height:80px}.stick .knob{width:40px;height:40px}.btn-shoot{width:70px;height:70px;font-size:24px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="stick" id="stickL"><div class="base"></div><div class="knob" id="knobL"></div></div>
  <div class="btn-shoot" id="btnR">💥</div>
</div>
<script>
const c=document.getElementById('c'), ctx=c.getContext('2d');
let W=innerWidth, H=innerHeight; c.width=W; c.height=H;
const stickR=document.getElementById('stickL'), knobR=document.getElementById('knobL'), btnL=document.getElementById('btnR');
stickR.style.right='20px'; btnL.style.left='20px';

const ctxA=new (window.AudioContext||window.webkitAudioContext)();
const beep=(f,d,t='sine',v=0.1)=>{const o=ctxA.createOscillator(),g=ctxA.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ctxA.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,ctxA.currentTime+d);o.stop(ctxA.currentTime+d)};
const sfx={shoot:()=>beep(800,0.08,'square',0.08), hit:()=>beep(300,0.1,'sawtooth',0.1), kill:()=>{beep(600,0.05);beep(400,0.1);beep(200,0.15)}, power:()=>{beep(500,0.05);beep(700,0.05);beep(900,0.05)}, hurt:()=>beep(150,0.2,'sawtooth',0.15)};

const P={x:W/2,y:H/2,r:14,spd:4,hp:5,maxHp:5,inv:0,power:1,pt:0,cd:0};
const bullets=[], enemies=[], parts=[], stars=[], pickups=[];
let score=0, wave=1, waveT=0, gameOver=false, shake=0;
for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.3,spd:Math.random()*0.5+0.2,o:Math.random()});

let input={x:0,y:0,shoot:false,aimX:0,aimY:-1}, touchJ=null, touchS=null;
function clamp(v,m,M){return v<m?m:v>M?M:v}
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.hypot(dx,dy)}
function angle(ax,ay,bx,by){return Math.atan2(by-ay,bx-ax)}

stickR.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];touchJ=t.identifier;updateStick(t)},{passive:false});
stickR.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches)if(t.identifier===touchJ){updateStick(t);break}},{passive:false});
stickR.addEventListener('touchend',e=>{for(let t of e.changedTouches)if(t.identifier===touchJ){touchJ=null;resetStick();break}},{passive:false});
btnL.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];touchS=t.identifier;input.shoot=true;ctxA.resume()},{passive:false});
btnL.addEventListener('touchend',e=>{for(let t of e.changedTouches)if(t.identifier===touchS){touchS=null;input.shoot=false;break}},{passive:false});
btnL.addEventListener('touchcancel',e=>{for(let t of e.changedTouches)if(t.identifier===touchS){touchS=null;input.shoot=false;break}},{passive:false});

window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w'){input.y=-1;input.aimX=0;input.aimY=-1}if(e.key==='ArrowDown'||e.key==='s'){input.y=1;input.aimX=0;input.aimY=1}if(e.key==='ArrowLeft'||e.key==='a'){input.x=-1;input.aimX=-1;input.aimY=0}if(e.key==='ArrowRight'||e.key==='d'){input.x=1;input.aimX=1;input.aimY=0}if(e.code==='Space'){input.shoot=true;ctxA.resume()}});
window.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')input.y=0;if(e.key==='ArrowDown'||e.key==='s')input.y=0;if(e.key==='ArrowLeft'||e.key==='a')input.x=0;if(e.key==='ArrowRight'||e.key==='d')input.x=0;if(e.code==='Space')input.shoot=false});
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;c.width=W;c.height=H;stickR.style.right='20px';btnL.style.left='20px';});

function updateStick(t){const r=stickR.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.hypot(dx,dy),maxR=45;const a=Math.atan2(dy,dx);const cd=Math.min(d,maxR);input.x=Math.cos(a)*cd/maxR;input.y=Math.sin(a)*cd/maxR;if(cd>15){input.aimX=Math.cos(a);input.aimY=Math.sin(a)}knobR.style.transform=`translate(${Math.cos(a)*cd}px, ${Math.sin(a)*cd}px)`;}
function resetStick(){input.x=input.y=0;knobR.style.transform='translate(0,0)';}

function spawnEnemy(){const side=Math.floor(Math.random()*4);let x,y;const m=50;
if(side===0){x=Math.random()*W;y=-m}else if(side===1){x=W+m;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+m}else{x=-m;y=Math.random()*H}
const t=Math.random()<0.3?1:Math.random()<0.6?2:0;
const hp=t===0?1:t===1?3:5;const spd=t===0?1.8:t===1?1.2:0.7;const sz=t===0?12:t===1?18:26;const col=t===0?'#ff6b6b':t===1?'#ffd93d':'#c44569';const val=t===0?10:t===1?25:50;
enemies.push({x,y,hp,maxHp:hp,spd,sz,col,val,type:t,ang:0});
}

function spawnPickup(x,y){if(Math.random()<0.15) pickups.push({x,y,type:Math.random()<0.5?'hp':'pow',t:0});}

function shoot(){if(P.cd>0)return;P.cd=P.power>=3?60:P.power===2?90:130;sfx.shoot();
const a=Math.atan2(input.aimY,input.aimX)||0;
if(P.power===1){bullets.push({x:P.x,y:P.y,a,spd:12,dmg:1,sz:5,col:'#fff',trail:[]})}
else if(P.power===2){[-0.15,0,0.15].forEach(o=>bullets.push({x:P.x,y:P.y,a:a+o,spd:11,dmg:1,sz:4,col:'#ffd93d',trail:[]}))}
else{[-0.25,-0.1,0,0.1,0.25].forEach(o=>bullets.push({x:P.x,y:P.y,a:a+o,spd:10,dmg:1,sz:4,col:'#ff6b9d',trail:[]}));[-0.5,0.5].forEach(o=>bullets.push({x:P.x,y:P.y,a:a+o,spd:9,dmg:1,sz:3,col:'#fff',trail:[]}))}
}

function addParts(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,col,sz:Math.random()*3+1})}

function loop(){
if(shake>0){shake--;ctx.save();ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2)}
ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,W,H);
stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${s.o})`;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();s.y+=s.spd;if(s.y>H){s.y=0;s.x=Math.random()*W}});

if(!gameOver){
P.x=clamp(P.x+input.x*P.spd,P.r,W-P.r);P.y=clamp(P.y+input.y*P.spd,P.r,H-P.r);
if(P.inv>0)P.inv--;
if(P.cd>0)P.cd--;
if(input.shoot)shoot();

waveT++;if(waveT>1800){wave++;waveT=0}
if(enemies.length<3+wave*0.8 && Math.random()<0.02)spawnEnemy();

bullets.forEach(b=>{b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>8)b.trail.pop();b.x+=Math.cos(b.a)*b.spd;b.y+=Math.sin(b.a)*b.spd;});
for(let i=bullets.length-1;i>=0;i--)if(bullets[i].x<-20||bullets[i].x>W+20||bullets[i].y<-20||bullets[i].y>H+20)bullets.splice(i,1);

enemies.forEach(e=>{const a=angle(e.x,e.y,P.x,P.y);e.x+=Math.cos(a)*e.spd;e.y+=Math.sin(a)*e.spd;e.ang=a;
bullets.forEach(b=>{if(dist(e.x,e.y,b.x,b.y)<e.sz+b.sz){e.hp-=b.dmg;addParts(b.x,b.y,e.col,3);sfx.hit();bullets.splice(bullets.indexOf(b),1);if(e.hp<=0){score+=e.val;sfx.kill();addParts(e.x,e.y,e.col,12);spawnPickup(e.x,e.y);enemies.splice(enemies.indexOf(e),1)}}});
if(dist(e.x,e.y,P.x,P.y)<e.sz+P.r && P.inv===0){P.hp--;P.inv=60;shake=12;sfx.hurt();addParts(P.x,P.y,'#ff6b6b',8);if(P.hp<=0)gameOver=true;}});
for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0)enemies.splice(i,1);

pickups.forEach(p=>{p.t+=0.1;p.y+=Math.sin(p.t)*0.5;if(dist(p.x,p.y,P.x,P.y)<P.r+15){if(p.type==='hp'&&P.hp<P.maxHp){P.hp=Math.min(P.maxHp,P.hp+1);sfx.power()}else if(p.type==='pow'&&P.power<3){P.power++;P.pt=0;sfx.power()}pickups.splice(pickups.indexOf(p),1)}});
for(let i=pickups.length-1;i>=0;i--)if(pickups[i].t>600)pickups.splice(i,1);

parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life-=0.02});
for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);

ctx.save();ctx.translate(P.x,P.y);if(P.inv>0&&Math.floor(P.inv/4)%2)ctx.globalAlpha=0.5;
ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-P.r*1.2);ctx.lineTo(P.r*0.7,0);ctx.lineTo(0,P.r*0.6);ctx.lineTo(-P.r*0.7,0);ctx.closePath();ctx.fill();
ctx.fillStyle=P.inv>0?'#ff6b9d':'#4ecdc4';ctx.beginPath();ctx.arc(0,0,P.r*0.4,0,Math.PI*2);ctx.fill();
ctx.restore();

bullets.forEach(b=>{b.trail.forEach((t,i)=>{ctx.globalAlpha=(i+1)/b.trail.length*0.4;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(t.x,t.y,b.sz*(i+1)/b.trail.length,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.sz,0,Math.PI*2);ctx.fill()});

enemies.forEach(e=>{ctx.fillStyle=e.col;ctx.beginPath();
if(e.type===0){ctx.arc(e.x,e.y,e.sz,0,Math.PI*2)}
else if(e.type===1){ctx.moveTo(e.x+e.sz*Math.cos(e.ang),e.y+e.sz*Math.sin(e.ang));ctx.lineTo(e.x+e.sz*0.5*Math.cos(e.ang+2.5),e.y+e.sz*0.5*Math.sin(e.ang+2.5));ctx.lineTo(e.x-e.sz*0.8*Math.cos(e.ang),e.y-e.sz*0.8*Math.sin(e.ang));ctx.lineTo(e.x+e.sz*0.5*Math.cos(e.ang-2.5),e.y+e.sz*0.5*Math.sin(e.ang-2.5))}
else{const s=5;for(let i=0;i<s;i++){const a=e.ang+i*Math.PI*2/s;ctx.lineTo(e.x+e.sz*Math.cos(a),e.y+e.sz*Math.sin(a))}}ctx.closePath();ctx.fill();
if(e.hp<e.maxHp){ctx.fillStyle='#000';ctx.fillRect(e.x-e.sz,e.y-e.sz-6,e.sz*2,4);ctx.fillStyle='#ff6b6b';ctx.fillRect(e.x-e.sz,e.y-e.sz-6,e.sz*2*e.hp/e.maxHp,4)}});

pickups.forEach(p=>{ctx.fillStyle=p.type==='hp'?'#ff6b6b':'#ffd93d';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t);ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,4);ctx.lineTo(-8,4);ctx.closePath();ctx.fill();ctx.fillStyle='#fff3';ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.restore()});

parts.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;

ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.fillText('Score: '+score,20,30);
ctx.fillText('Wave: '+wave,20,55);
for(let i=0;i<P.maxHp;i++){ctx.fillStyle=i<P.hp?'#ff6b6b':'#333';ctx.beginPath();ctx.arc(W-30-i*22,30,8,0,Math.PI*2);ctx.fill()}
ctx.fillStyle=P.power===1?'#fff':P.power===2?'#ffd93d':'#ff6b9d';ctx.font='16px system-ui';ctx.fillText(['NORMAL','SPREAD','CHAOS'][P.power-1],W-120,55);
}else{
ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ff6b9d';ctx.font='bold 48px system-ui';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-40);
ctx.fillStyle='#fff';ctx.font='24px system-ui';ctx.fillText('Score: '+score,W/2,H/2+10);
ctx.fillStyle='#ffd93d';ctx.font='18px system-ui';ctx.fillText('Toque ou Espaço para reiniciar',W/2,H/2+50);ctx.textAlign='left';
}
if(shake>0)ctx.restore();
requestAnimationFrame(loop);
}
c.addEventListener('mousedown',e=>{if(gameOver){restart();return}if(e.clientX>W/2){touchJ=-1;updateStick(e)}else{touchS=-1;input.shoot=true;ctxA.resume()}});
c.addEventListener('mousemove',e=>{if(touchJ===-1)updateStick(e)});
c.addEventListener('mouseup',e=>{if(touchJ===-1){touchJ=null;resetStick()}if(touchS===-1){touchS=null;input.shoot=false}});
c.addEventListener('click',()=>{if(gameOver)restart()});

function restart(){P.x=W/2;P.y=H/2;P.hp=5;P.power=1;P.inv=0;P.cd=0;input.aimX=0;input.aimY=-1;bullets.length=0;enemies.length=0;parts.length=0;pickups.length=0;score=0;wave=1;waveT=0;gameOver=false;shake=0;ctxA.resume()}
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vida de Pescador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Área SVG do jogo -->
        <svg id="game-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#06103a;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <g id="background-layer">
                <!-- Ondas e fundo serão gerados aqui -->
            </g>
            
            <g id="fog-layer">
                <!-- Camada de névoa noir -->
                <rect width="100%" height="100%" fill="#050505" opacity="0.5" />
            </g>
            
            <g id="game-layer">
                <!-- Barco, Peixes, Linha de pesca -->
            </g>
        </svg>

        <!-- Interface (UI) sobreposta -->
        <div id="ui-layer">
            <div id="hud">
                <div class="stat-box">
                    <span id="money-display">$0</span>
                </div>
                <div class="stat-box">
                    <span id="inventory-display">Inventário: Vazio</span>
                </div>
            </div>
            
            <!-- Telas de Menu e Notificação -->
            <div id="screen-overlay" class="hidden">
                <div id="start-screen" class="screen-content">
                    <h1>Pesca Caótica</h1>
                    <p>Toque nas pontas para navegar.<br>Toque para puxar, arraste para afastar.</p>
                    <button id="start-btn">Iniciar Noite</button>
                </div>
                <div id="notification-screen" class="screen-content hidden">
                    <h2 id="notif-title" class="notif-title"></h2>
                    <p id="notif-desc"></p>
                </div>
            </div>

            <!-- Barra de Tensão -->
            <div class="tension-container">
                <div class="tension-label">Tensão</div>
                <div class="tension-bar-bg">
                    <div id="tension-fill" class="tension-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>

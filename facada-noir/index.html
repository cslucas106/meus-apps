<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Facada Noir - Jogo de investigação noir 2D">
    <meta name="theme-color" content="#1a1a1a">
    <title>Facada Noir</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/ui/icon-192.png">
    <link rel="apple-touch-icon" href="assets/images/ui/icon-192.png">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="loading-screen" class="screen active" aria-hidden="true">
            <div class="loading-content">
                <div class="logo">FACADA NOIR</div>
                <div class="loading-bar">
                    <div class="loading-progress" id="loading-progress"></div>
                </div>
                <div class="loading-text" id="loading-text">Carregando...</div>
            </div>
        </div>
        <div id="ui-overlay" class="screen" aria-hidden="true"></div>
    </div>

    <!-- Config & Utils -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>

    <!-- Core Systems -->
    <script src="js/core/asset-loader.js"></script>
    <script src="js/core/input.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/renderer.js"></script>
    <script src="js/core/state-machine.js"></script>

    <!-- Entities -->
    <script src="js/entities/entity.js"></script>
    <script src="js/entities/player.js"></script>
    <script src="js/entities/npc.js"></script>
    <script src="js/entities/interactable.js"></script>
    <script src="js/entities/light.js"></script>

    <!-- Game Systems -->
    <script src="js/systems/dialogue.js"></script>
    <script src="js/systems/investigation.js"></script>
    <script src="js/systems/inventory.js"></script>
    <script src="js/systems/progression.js"></script>
    <script src="js/systems/save.js"></script>

    <!-- Scenes -->
    <script src="js/scenes/scene-base.js"></script>
    <script src="js/scenes/rua-principal.js"></script>
    <script src="js/scenes/delegacia.js"></script>
    <script src="js/scenes/apartamento-vitima.js"></script>
    <script src="js/scenes/submundo.js"></script>
    <script src="js/scenes/cutscene.js"></script>

    <!-- UI -->
    <script src="js/ui/hud.js"></script>
    <script src="js/ui/menu.js"></script>
    <script src="js/ui/notebook.js"></script>
    <script src="js/ui/dialogue-box.js"></script>
    <script src="js/ui/transition.js"></script>

    <!-- Main Game Loop -->
    <script src="js/core/game.js"></script>
</body>
</html>
